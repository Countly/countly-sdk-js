<!-- Used in loader tests: a page whose code imports the SDK before the loader, as an app can when some of its modules import
     countly-sdk-web and others countly-sdk-web/loader -->
<html>
<head>
  <script type="importmap">{ "imports": { "countly-sdk-web": "../../Countly.js" } }</script>
  <script type='module'>
    import Countly from '../../Countly.js';
    import Loader from '../../loader.js';

    window.localStorage.clear();
    window.sameObject = Countly === Loader;
    Loader.add_event({ key: "loader_before_init", count: 1 });
    Loader.init({ app_key: "LOADER_ORDER_APP_KEY", url: "https://your.domain.count.ly", debug: true, test_mode: true });
    setTimeout(function () {
      Loader.add_event({ key: "loader_after_init", count: 1 });
      window.done = true;
    }, 500);
  </script>
</head>
<body>
  <h1>Loader after the SDK</h1>
</body>
</html>
