name: Static analysis

on:
  pull_request:
  push:
    branches:
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # ESLint is installed outside the repository, so the configuration is copied next to it for its imports to resolve.
      - name: Install ESLint
        run: |
          npm install --prefix "$RUNNER_TEMP/eslint" --no-save --no-package-lock --no-audit --no-fund --ignore-scripts \
            eslint@10.13.0 @eslint/js@10.0.1 globals@17.14.0
          cp .github/eslint.config.mjs "$RUNNER_TEMP/eslint/"

      # On pull requests the base branch is linted too, so that only findings it lacks can fail the job.
      - name: Lint the SDK
        run: |
          # Lints the SDK sources of the checkout in $1, writing SARIF to $2. ESLint exits with 1 for findings, 2 when it fails.
          lint() {
            code=0
            (cd "$1" && "$RUNNER_TEMP/eslint/node_modules/.bin/eslint" -c "$RUNNER_TEMP/eslint/eslint.config.mjs" \
              -f "$GITHUB_WORKSPACE/.github/scripts/eslint-sarif.mjs" -o "$2" Countly.js countly_sw.js modules) || code=$?
            [ "$code" -le 1 ]
          }
          lint "$GITHUB_WORKSPACE" "$RUNNER_TEMP/eslint.sarif"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The first parent of the pull request's merge commit is the base branch it merges into.
            git worktree add "$RUNNER_TEMP/base" HEAD^1
            lint "$RUNNER_TEMP/base" "$RUNNER_TEMP/eslint-base.sarif"
          fi

      # Every finding goes to the job summary; a new one at warning or error level fails the job.
      - name: Summarize the findings
        run: |
          # The default shell has no pipefail, and without it tee would hide the summary's exit code.
          set -o pipefail
          base=()
          if [ -f "$RUNNER_TEMP/eslint-base.sarif" ]; then
            base=(--base "$RUNNER_TEMP/eslint-base.sarif" --base-root "$RUNNER_TEMP/base")
          fi
          python3 .github/scripts/sarif_summary.py ESLint "$RUNNER_TEMP/eslint.sarif" "${base[@]}" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/static-analysis.md"

      - name: Write the CI report fragment
        if: ${{ !cancelled() }}
        run: |
          [ -s "$RUNNER_TEMP/static-analysis.md" ] || exit 0
          new=$(sed -n 's/^### New compared with the base branch: \([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/static-analysis.md")
          case "$new" in
            '') summary=$(sed -n '1s/^### //p' "$RUNNER_TEMP/static-analysis.md") ;;
            0) summary="No new findings" ;;
            1) summary="1 new finding" ;;
            *) summary="$new new findings" ;;
          esac
          mkdir -p "$RUNNER_TEMP/ci-report-static-analysis"
          {
            printf 'Static analysis\n%s\n' "$summary"
            cat "$RUNNER_TEMP/static-analysis.md"
          } > "$RUNNER_TEMP/ci-report-static-analysis/report.md"

      - name: Upload the CI report fragment
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-static-analysis
          path: ${{ runner.temp }}/ci-report-static-analysis
          if-no-files-found: ignore
