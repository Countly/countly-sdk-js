name: Tests

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build ESM, CJS and UMD bundles
        run: npm run build

      - name: Check the typings and the quick loader against the SDK, and the countly-sdk-web sync
        run: npm run test:tooling

      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  node:
    name: Node ${{ matrix.node }} runtime
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # the bundles are consumed as-is, so no dependency install: the smoke test only needs Node itself
      - name: Smoke test the bundles in a non-browser runtime
        run: npm run test:smoke

  cypress:
    name: Cypress ${{ matrix.browser }} ${{ matrix.shard }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        browser: [chrome, firefox, edge, electron]
        # request_backoff.cy.js is real-time back-off behaviour and alone takes as long as every
        # other spec together, so it gets its own job and the rest run in parallel with it
        shard: [core, backoff]
        include:
          - os: windows-latest
            browser: chrome
            shard: core
          - os: windows-latest
            browser: chrome
            shard: backoff
          - os: macos-latest
            browser: chrome
            shard: core
          - os: macos-latest
            browser: chrome
            shard: backoff
    env:
      # only one leg pays for instrumentation and produces the coverage report
      COVERAGE_LEG: ${{ matrix.browser == 'chrome' && matrix.shard == 'core' && matrix.os == 'ubuntu-24.04' }}
      SHARD_ARGS: ${{ matrix.shard == 'backoff' && '--spec cypress/e2e/request_backoff.cy.js' || '--config excludeSpecPattern=cypress/e2e/request_backoff.cy.js' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Run Cypress
        uses: cypress-io/github-action@18016a55674bd02cabf197de5762a1710cb5577c # v7.4.9
        env:
          CYPRESS_COVERAGE: ${{ env.COVERAGE_LEG }}
        with:
          # the action splits this itself, so quotes would reach cypress literally
          command: npx cypress run --browser ${{ matrix.browser }} ${{ env.SHARD_ARGS }} --reporter junit --reporter-options mochaFile=results/${{ matrix.browser }}-${{ matrix.shard }}-[hash].xml

      - name: Test report
        id: test-report
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        if: always() && runner.os == 'Linux'
        with:
          check_name: Test results (${{ matrix.browser }} ${{ matrix.shard }}, ${{ matrix.os }})
          files: results/*.xml
          comment_mode: ${{ env.COVERAGE_LEG == 'true' && 'always' || 'off' }}
          report_individual_runs: true
          action_fail: false
          action_fail_on_inconclusive: false

      - name: Test report (Windows)
        id: test-report-windows
        uses: EnricoMi/publish-unit-test-result-action/windows@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        if: always() && runner.os == 'Windows'
        with:
          check_name: Test results (${{ matrix.browser }} ${{ matrix.shard }}, ${{ matrix.os }})
          files: results/*.xml
          comment_mode: off
          report_individual_runs: true
          action_fail: false
          action_fail_on_inconclusive: false

      - name: Test report (macOS)
        id: test-report-macos
        uses: EnricoMi/publish-unit-test-result-action/macos@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        if: always() && runner.os == 'macOS'
        with:
          check_name: Test results (${{ matrix.browser }} ${{ matrix.shard }}, ${{ matrix.os }})
          files: results/*.xml
          comment_mode: off
          report_individual_runs: true
          action_fail: false
          action_fail_on_inconclusive: false

      - name: Write the CI report fragment (test results)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          RESULTS: ${{ steps.test-report.outputs.json || steps.test-report-windows.outputs.json || steps.test-report-macos.outputs.json }}
          TITLE: Test results (${{ matrix.browser }} ${{ matrix.shard }}, ${{ matrix.os }})
          FRAGMENT: ci-report-unit-tests-${{ matrix.browser }}-${{ matrix.shard }}-${{ matrix.os }}
        run: |
          if [ -z "$RESULTS" ]; then
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/$FRAGMENT"
          jq -r --arg title "$TITLE" '$title,
            "\(.stats.tests_succ) passed, \(.stats.tests_fail + .stats.tests_error) failed, \(.stats.tests_skip) skipped",
            if .check_url then "The [check run](\(.check_url)) lists each test." else empty end
          ' <<< "$RESULTS" > "$RUNNER_TEMP/$FRAGMENT/report.md"

      - name: Upload the CI report fragment (test results)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-unit-tests-${{ matrix.browser }}-${{ matrix.shard }}-${{ matrix.os }}
          path: ${{ runner.temp }}/ci-report-unit-tests-${{ matrix.browser }}-${{ matrix.shard }}-${{ matrix.os }}
          if-no-files-found: ignore

      - name: Upload junit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-${{ matrix.browser }}-${{ matrix.shard }}-${{ matrix.os }}
          path: results
          if-no-files-found: ignore

      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.browser }}-${{ matrix.shard }}-${{ matrix.os }}
          path: cypress/screenshots
          if-no-files-found: ignore

      # the per-spec reports only merge json; the html report is built once here
      - name: Coverage report
        if: always() && env.COVERAGE_LEG == 'true' && hashFiles('.nyc_output/out.json') != ''
        run: |
          npx nyc report --reporter=lcov --reporter=json-summary --report-dir=coverage
          node .github/scripts/coverage-summary.mjs coverage/coverage-summary.json coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.COVERAGE_LEG == 'true'
        with:
          name: coverage-report
          path: |
            coverage/lcov-report
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: ignore

      - name: Coverage comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: always() && env.COVERAGE_LEG == 'true' && github.event_name == 'pull_request' && hashFiles('coverage/summary.md') != ''
        continue-on-error: true
        with:
          header: coverage
          path: coverage/summary.md
